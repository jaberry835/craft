<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">Junior Workbench Architecture</title>
  <desc id="desc">Architecture diagram showing the React client, Express server, agent loop, storage abstractions, and Azure-backed persistence boundaries.</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .title { font: 700 34px Georgia, serif; fill: #1f2933; }
      .subtitle { font: 400 16px Georgia, serif; fill: #52606d; }
      .section { font: 700 18px Georgia, serif; fill: #102a43; }
      .label { font: 600 16px Georgia, serif; fill: #102a43; }
      .text { font: 400 14px Georgia, serif; fill: #334e68; }
      .small { font: 400 12px Georgia, serif; fill: #486581; }
      .card { fill: #fffdf8; stroke: #9fb3c8; stroke-width: 2; rx: 18; ry: 18; }
      .accentA { fill: #d9e2ec; stroke: #486581; stroke-width: 2; rx: 18; ry: 18; }
      .accentB { fill: #f7d9c4; stroke: #9c4221; stroke-width: 2; rx: 18; ry: 18; }
      .accentC { fill: #d9f0d8; stroke: #2f6f3e; stroke-width: 2; rx: 18; ry: 18; }
      .accentD { fill: #fde68a; stroke: #b7791f; stroke-width: 2; rx: 18; ry: 18; }
      .accentE { fill: #e9d8fd; stroke: #6b46c1; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #52606d; stroke-width: 2.5; fill: none; }
      .lineSoft { stroke: #829ab1; stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
      .arrow { marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="960" />
  <text class="title" x="48" y="58">Junior Workbench Architecture</text>
  <text class="subtitle" x="48" y="88">Web client, server agent loop, owner-scoped workspaces, and separated persistence boundaries</text>

  <rect class="accentA" x="48" y="128" width="320" height="200" />
  <text class="section" x="72" y="162">Browser Client</text>
  <text class="label" x="72" y="196">React + Vite</text>
  <text class="text" x="72" y="222">Workbench UI</text>
  <text class="text" x="72" y="246">Monaco editor + markdown preview</text>
  <text class="text" x="72" y="270">Chat panel + pending change review</text>
  <text class="text" x="72" y="294">Workspace settings and admin catalog views</text>

  <rect class="accentB" x="420" y="128" width="420" height="200" />
  <text class="section" x="444" y="162">Server API</text>
  <text class="label" x="444" y="196">Express app</text>
  <text class="text" x="444" y="222">Workspace routes, settings routes, agent message routes</text>
  <text class="text" x="444" y="246">Request identity currently stubbed to admin</text>
  <text class="text" x="444" y="270">Owner-scoped workspace resolution through manager + registry</text>
  <text class="text" x="444" y="294">Shared admin catalogs remain distinct from workspace-local state</text>

  <rect class="accentC" x="892" y="128" width="460" height="200" />
  <text class="section" x="916" y="162">Agent Runtime</text>
  <text class="label" x="916" y="196">SimpleJuniorAgent + JuniorAgentLoop</text>
  <text class="text" x="916" y="222">Planner/tool loop over workspace files</text>
  <text class="text" x="916" y="246">Grounding service + workspace index</text>
  <text class="text" x="916" y="270">ChangeManager stages edits for human approval</text>
  <text class="text" x="916" y="294">Azure OpenAI client executes model calls</text>

  <rect class="card" x="48" y="392" width="1304" height="228" />
  <text class="section" x="72" y="426">Server Composition Boundaries</text>

  <rect class="accentD" x="72" y="452" width="220" height="136" />
  <text class="label" x="94" y="484">Workspace Manager</text>
  <text class="text" x="94" y="510">LocalWorkspaceManager</text>
  <text class="text" x="94" y="534">WorkspaceRegistry</text>
  <text class="small" x="94" y="560">Owns runtime creation and owner-scoped lookup</text>

  <rect class="accentD" x="322" y="452" width="220" height="136" />
  <text class="label" x="344" y="484">Workspace Storage</text>
  <text class="text" x="344" y="510">LocalWorkspaceStorage</text>
  <text class="text" x="344" y="534">CachedBlobWorkspaceStorage</text>
  <text class="small" x="344" y="560">Blob is source of truth, local disk acts as cache</text>

  <rect class="accentD" x="572" y="452" width="220" height="136" />
  <text class="label" x="594" y="484">Workspace Config</text>
  <text class="text" x="594" y="510">WorkspaceConfigStore</text>
  <text class="text" x="594" y="534">WorkspaceStateStore</text>
  <text class="small" x="594" y="560">Config only, no secret values</text>

  <rect class="accentD" x="822" y="452" width="220" height="136" />
  <text class="label" x="844" y="484">Workspace Secrets</text>
  <text class="text" x="844" y="510">WorkspaceSecretStore</text>
  <text class="text" x="844" y="534">Local or Key Vault backed</text>
  <text class="small" x="844" y="560">Connector keys + MCP secrets</text>

  <rect class="accentD" x="1072" y="452" width="256" height="136" />
  <text class="label" x="1094" y="484">Runtime Session State</text>
  <text class="text" x="1094" y="510">ChatSessionStore</text>
  <text class="text" x="1094" y="534">PendingChangeStore</text>
  <text class="small" x="1094" y="560">Separate stores for chat history and staged edits</text>

  <rect class="card" x="48" y="672" width="1304" height="232" />
  <text class="section" x="72" y="706">Persistence Targets</text>

  <rect class="accentE" x="72" y="732" width="250" height="132" />
  <text class="label" x="94" y="764">Local Development</text>
  <text class="text" x="94" y="790">`data/workspaces/*`</text>
  <text class="text" x="94" y="814">`.junior/workspace-config.json`</text>
  <text class="text" x="94" y="838">Local workspace secret JSON files</text>

  <rect class="accentE" x="352" y="732" width="250" height="132" />
  <text class="label" x="374" y="764">Azure Blob Storage</text>
  <text class="text" x="374" y="790">Workspace file trees</text>
  <text class="text" x="374" y="814">Prefix: `workspaces/&lt;workspace-id&gt;/`</text>
  <text class="text" x="374" y="838">Local cache root remains writable</text>

  <rect class="accentE" x="632" y="732" width="330" height="132" />
  <text class="label" x="654" y="764">Azure Cosmos DB</text>
  <text class="text" x="654" y="790">`Workspaces` for workspace catalog metadata</text>
  <text class="text" x="654" y="814">`WorkspaceConfig` for workspace-local config</text>
  <text class="text" x="654" y="838">`ChatSessions` and `PendingChanges` as separate containers</text>

  <rect class="accentE" x="992" y="732" width="336" height="132" />
  <text class="label" x="1014" y="764">Azure Key Vault</text>
  <text class="text" x="1014" y="790">Workspace connector API keys</text>
  <text class="text" x="1014" y="814">Workspace MCP bearer tokens, API keys, custom headers</text>
  <text class="text" x="1014" y="838">Secret names include prefix, owner, workspace, and kind</text>

  <path class="line arrow" d="M 368 228 L 420 228" />
  <path class="line arrow" d="M 840 228 L 892 228" />

  <path class="line arrow" d="M 630 328 L 630 392" />
  <path class="lineSoft arrow" d="M 182 588 L 182 732" />
  <path class="lineSoft arrow" d="M 432 588 L 477 732" />
  <path class="lineSoft arrow" d="M 682 588 L 797 732" />
  <path class="lineSoft arrow" d="M 932 588 L 1160 732" />
  <path class="lineSoft arrow" d="M 1200 588 L 797 732" />

  <text class="small" x="48" y="934">Current limits: request identity is stubbed to admin; blob mode still uses a storage connection string instead of managed identity.</text>
</svg>
