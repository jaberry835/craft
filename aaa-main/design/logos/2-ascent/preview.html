<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AAA logo · Ascent</title><style>
  body { margin:0; padding:28px 32px 36px; background:#f7f7f8; color:#28252e; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  h1 { margin:0 0 4px; font:600 22px "Segoe UI Variable Display","Segoe UI",sans-serif; letter-spacing:-.015em; }
  .sub { margin:0 0 20px; color:#746f7b; font-size:13px; }

  .card p { min-height:38px; margin:6px 20px 0; color:#746f7b; font-size:12.5px; line-height:1.5; }
  .hero { display:grid; grid-template-columns:1fr 1fr; margin-top:14px; }
  .hero > div { display:grid; place-items:center; height:200px; }
  .hero .dark { background:#1b1a1e; }
  .hero img { width:132px; height:132px; }
  .lockup { display:flex; align-items:center; height:76px; padding:0 20px; border-top:1px solid #ebe9ee; }
  .lockup.dark { background:#1b1a1e; border-top-color:#2c2b31; }
  .lockup img { height:44px; }
  .sizes { display:flex; align-items:center; gap:16px; height:52px; padding:0 20px; border-top:1px solid #ebe9ee; }
  .tab { display:flex; align-items:center; gap:7px; margin-left:auto; padding:6px 11px; border:1px solid #ebe9ee; border-radius:8px 8px 0 0; background:#f7f7f8; font-size:11.5px; }
</style></head><body><div class="grid single">
<section class="card" id="ascent">

  <div class="hero"><div><img src="./mark.svg" alt=""></div><div class="dark"><img src="./mark.svg" alt=""></div></div>
