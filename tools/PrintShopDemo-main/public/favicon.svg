<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d0d17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Pixel grid dots (subtle) -->
  <g fill="#60a5fa" opacity="0.12">
    <rect x="4" y="4" width="2" height="2" rx=".5"/>
    <rect x="8" y="4" width="2" height="2" rx=".5"/>
    <rect x="12" y="4" width="2" height="2" rx=".5"/>
    <rect x="4" y="8" width="2" height="2" rx=".5"/>
    <rect x="4" y="12" width="2" height="2" rx=".5"/>
    <rect x="26" y="26" width="2" height="2" rx=".5"/>
    <rect x="22" y="26" width="2" height="2" rx=".5"/>
    <rect x="18" y="26" width="2" height="2" rx=".5"/>
    <rect x="26" y="22" width="2" height="2" rx=".5"/>
    <rect x="26" y="18" width="2" height="2" rx=".5"/>
  </g>
  <!-- Printer body -->
  <rect x="6" y="12" width="20" height="10" rx="2" fill="url(#accent)" opacity="0.9"/>
  <!-- Paper coming out (top) -->
  <rect x="9" y="5" width="14" height="9" rx="1" fill="#e2e8f0"/>
  <!-- Print lines on paper -->
  <line x1="11" y1="8" x2="21" y2="8" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="10.5" x2="18" y2="10.5" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Paper tray (bottom) -->
  <rect x="10" y="21" width="12" height="6" rx="1" fill="#e2e8f0" opacity="0.85"/>
  <!-- Tray lines -->
  <line x1="12" y1="24" x2="20" y2="24" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Printer detail dot (power LED) -->
  <circle cx="24" cy="17" r="1.2" fill="#4ade80"/>
</svg>
